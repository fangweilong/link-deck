name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Cargo.toml version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "✗ Error: Failed to extract version from Cargo.toml"
            exit 1
          fi
          echo "Detected version from Cargo.toml: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          git fetch --tags
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on remote. Skipping GitHub Release publication."
            echo "NEW_VERSION=false" >> $GITHUB_ENV
          else
            echo "New version detected: v$VERSION. Will publish GitHub Release."
            echo "NEW_VERSION=true" >> $GITHUB_ENV
          fi

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: link-deck-v${{ env.VERSION }}
          path: target/release/link-deck.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.NEW_VERSION == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: LinkDeck v${{ env.VERSION }}
          files: target/release/link-deck.exe
          draft: false
          prerelease: false
          generate_release_notes: true
